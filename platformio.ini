; TamaPoke - ESP32-S3 firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.75
;
; Profiles:
;   release  public, debug-free Gen-3 build (TAMAPOKE_GEN3_RELEASE), version 1.36.1
;   local    Gen-3 hardware/debug build   (TAMAPOKE_LOCAL_TEST),   version 1.36.0-gen3-local
;
; The firmware needs an ESP32 Arduino core 3.x (ESP_I2S, Arduino 3.x APIs). The
; official PlatformIO espressif32 platform still ships core 2.x, so this project
; uses the pioarduino distribution, which packages the upstream Arduino releases.

[platformio]
default_envs = release
src_dir = src
include_dir = include

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = tamapoke_esp32s3
framework = arduino

board_build.partitions = partitions/app3M_fat9M_16MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    moononournation/GFX Library for Arduino@1.6.7
    lewisxhe/SensorLib@0.4.1
    lewisxhe/XPowersLib@0.3.3

[env:release]
build_flags = -DTAMAPOKE_GEN3_RELEASE

[env:local]
build_flags = -DTAMAPOKE_LOCAL_TEST
